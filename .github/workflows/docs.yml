name: Trigger Website Rebuild (Docs Updated)

on:
  push:
    branches: [main]
    paths: ['docs/**']

jobs:
  dispatch:
    # Fork safety: only the upstream repository owns the website deploy token.
    if: github.repository_owner == 'jackwener' && github.event.repository.name == 'OpenCLI'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger opencli-website rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          repository: jackwener/opencli-website
          event-type: docs-updated
